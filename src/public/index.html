<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Aimee - Wine Sales Assistant</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="screen active">
    <div class="login-container">
      <div class="logo">
        <div class="logo-icon">A</div>
        <h1>Aimee</h1>
        <p class="tagline">Wine Sales Voice Assistant</p>
      </div>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required autocomplete="email">
        <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
        <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
        <p id="login-error" class="error-text"></p>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-screen" class="screen">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="app-name">Aimee</span>
      </div>
      <div class="top-bar-right">
        <span id="user-name" class="user-name"></span>
        <button id="logout-btn" class="btn-icon" title="Sign out">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <!-- Views Container -->
    <main class="views">

      <!-- Voice View (Default) -->
      <div id="view-voice" class="view active">
        <div class="conversation" id="conversation">
          <div class="conversation-welcome">
            <p>Hi! I'm Aimee, your wine sales assistant.</p>
            <p>Tap the microphone to talk, or type below.</p>
          </div>
        </div>

        <div class="voice-controls">
          <div class="text-input-row">
            <input type="text" id="text-input" placeholder="Type a command..." autocomplete="off">
            <button id="text-send-btn" class="btn-icon send-btn" title="Send">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
          </div>
          <button id="mic-btn" class="mic-button" title="Push to talk">
            <svg class="mic-icon" width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
            <div class="mic-pulse"></div>
          </button>
        </div>
      </div>

      <!-- Orders View -->
      <div id="view-orders" class="view">
        <div class="view-header">
          <h2>Orders</h2>
          <div class="view-filters">
            <select id="order-status-filter">
              <option value="">All Statuses</option>
              <option value="pending_confirmation">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="processing">Processing</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div id="orders-list" class="card-list">
          <div class="loading">Loading orders...</div>
        </div>
      </div>

      <!-- Accounts View -->
      <div id="view-accounts" class="view">
        <div class="view-header">
          <h2>Accounts</h2>
          <input type="search" id="account-search" placeholder="Search accounts..." class="search-input">
        </div>
        <div id="accounts-list" class="card-list">
          <div class="loading">Loading accounts...</div>
        </div>
      </div>

      <!-- Schedule View -->
      <div id="view-schedule" class="view">
        <div class="view-header">
          <h2>Schedule</h2>
        </div>
        <div id="schedule-list" class="card-list">
          <div class="loading">Loading appointments...</div>
        </div>
      </div>

      <!-- Wines View -->
      <div id="view-wines" class="view">
        <div class="view-header">
          <h2>Wine Catalog</h2>
          <input type="search" id="wine-search" placeholder="Search wines..." class="search-input">
        </div>
        <div id="wines-list" class="card-list">
          <div class="loading">Loading wines...</div>
        </div>
      </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-view="voice">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        <span>Voice</span>
      </button>
      <button class="nav-item" data-view="orders">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <span>Orders</span>
      </button>
      <button class="nav-item" data-view="accounts">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Accounts</span>
      </button>
      <button class="nav-item" data-view="schedule">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>
        <span>Schedule</span>
      </button>
      <button class="nav-item" data-view="wines">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2l.01 6L10 12l-3.99 4.01L6 22h12v-6.01L14 12l4-3.99V2H6zm10 14.5V20H8v-3.5l4-4 4 4z"/></svg>
        <span>Wines</span>
      </button>
    </nav>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/voice.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
